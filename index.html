<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation - Aliyah & Yuangga</title>
    
    <!-- Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #C09B38; /* Warna emas sesuai gambar */
            --text-dark: #333333;
            --text-light: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #EAE7DF; /* Warna background luar */
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        /* ================= CONTAINER UTAMA (Mobile View) ================= */
        .invitation-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #FFFFFF;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ================= ORNAMEN POJOK ATAS ================= */
        .top-ornament {
            position: absolute;
            top: -5%;
            left: 0;
            width: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* ================= GARIS LENGKUNG (ARCH) ================= */
        .arch-border {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 70%;
            border: 2px solid var(--gold);
            border-radius: 250px 250px 0 0; /* Membuat bentuk lengkung */
            z-index: 1;
            opacity: 0.8;
        }

        /* ================= KONTEN TEKS ================= */
        .content {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 80px 30px 400px 30px; /* Padding bawah besar untuk area bunga */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bismillah / Logo */
        .bismillah {
            width: 80px;
            margin-bottom: 50px;
            opacity: 0;
            animation: slideDown 1s ease forwards 0.3s;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .together {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 400;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.6s;
        }

        .names {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: var(--gold);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.3;
            opacity: 0;
            animation: slideUp 1s ease forwards 0.9s;
        }

        .and {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--text-dark);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.2s;
        }

        .and::before, .and::after {
            content: "";
            width: 40px;
            height: 1px;
            background-color: var(--gold);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .request {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: 50px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.5s;
        }

        .wedding-text {
            font-family: 'Great Vibes', cursive;
            font-size: 65px;
            color: var(--gold);
            margin: 10px 0;
            line-height: 1;
            opacity: 0;
            animation: zoomIn 1.2s ease forwards 1.8s;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .ceremony {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: var(--text-dark);
            text-transform: uppercase;
            line-height: 1.4;
            opacity: 0;
            animation: fadeIn 1s ease forwards 2.1s;
        }

        /* ================= ORNAMEN BAWAH (GAPURA & BUNGA) ================= */
        .bottom-ornament {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 15;
            pointer-events: none;
        }

        /* Animasi Gapura Mengembang (Breathing) */
        .gapura-left, .gapura-right {
            position: absolute;
            bottom: 0;
            width: 45%;
            animation: floatGapura 6s ease-in-out infinite;
        }

        .gapura-left {
            left: -5%;
            transform-origin: bottom left;
        }

        .gapura-right {
            right: -5%;
            transform-origin: bottom right;
        }

        @keyframes floatGapura {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.03) rotate(1deg); }
        }

        .flowers-bottom {
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            z-index: 20;
        }

        /* ================= TOMBOL & ANIMASI TAMBAHAN ================= */
        .btn-open {
            margin-top: 30px;
            background-color: var(--gold);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(192, 155, 56, 0.4);
            transition: all 0.3s ease;
            z-index: 30;
            position: relative;
        }

        .btn-open:hover {
            background-color: #a8852f;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(192, 155, 56, 0.6);
        }

        /* Efek Bunga Jatuh */
        .petal {
            position: absolute;
            top: -20px;
            background-color: #fff0f0;
            border-radius: 50% 0 50% 50%;
            box-shadow: inset 0 0 5px rgba(192, 155, 56, 0.2);
            pointer-events: none;
            z-index: 5;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="invitation-container">
        
        <!-- Ornamen Pojok Atas (Ganti src dengan gambar bunga Anda) -->
        <img src="https://i.ibb.co/3s6yH4v/top-floral.png" alt="Top Floral" class="top-ornament" style="opacity: 0.9;">

        <!-- Garis Emas Melengkung -->
        <div class="arch-border"></div>

        <div class="content">
            <!-- Logo Bismillah (Ganti src jika perlu) -->
            <img src="https://i.ibb.co/6PZq6Z2/bismillah-gold.png" alt="Bismillah" class="bismillah">

            <div class="together">Together With Their Families</div>

            <!-- NAMA MEMPELAI (Font Cinzel) -->
            <div class="names">
                Aliyah Queenshena
            </div>
            
            <div class="and">AND</div>
            
            <div class="names">
                Yuangga Bagaskara
            </div>

            <div class="request">
                Request The Honor Of<br>Your Presence Of Their
            </div>

            <!-- Tulisan Wedding (Font Great Vibes) -->
            <div class="wedding-text">Wedding</div>

            <div class="ceremony">
                Ceremony<br>Insyaallah
            </div>

            <button class="btn-open" onclick="alert('Ini adalah demo tombol. Di sini Anda bisa mengarahkan ke halaman utama undangan.')">Buka Undangan</button>
        </div>

        <!-- Ornamen Bawah: Gapura Emas -->
        <div class="bottom-ornament">
            <img src="https://i.ibb.co/0yH1Xqz/gapura-left.png" alt="Gapura Kiri" class="gapura-left">
            <img src="https://i.ibb.co/0yH1Xqz/gapura-right.png" alt="Gapura Kanan" class="gapura-right">
            
            <!-- Ornamen Bunga Bawah -->
            <img src="https://i.ibb.co/5Wk5Z1b/bottom-floral.png" alt="Bottom Floral" class="flowers-bottom">
        </div>

    </div>

    <script>
        // Script untuk membuat efek kelopak bunga jatuh (opsional)
        function createPetal() {
            const container = document.querySelector('.invitation-container');
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Random size, position, and animation duration
            const size = Math.random() * 8 + 6;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 3 + 4) + 's';
            
            container.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 7000);
        }

        // Mulai hujan kelopak setiap 800ms
        setInterval(createPetal, 800);
    </script>

</body>
</html>
