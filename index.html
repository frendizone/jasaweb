<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undangan Elegan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #f5f5f5;
    overflow-x: hidden;
    position: relative;
  }

  /* Partikel container */
  #particles-js {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .ornamen {
    font-size: 46px;
    animation: float 6s ease-in-out infinite;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 12px rgba(212,175,55,0.6));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(8deg); }
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 24px;
  }

  .names {
    font-family: 'Cormorant Garamond', serif;
    font-size: 60px;
    line-height: 1;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(212,175,55,0.3);
  }

  .names .amp {
    font-size: 40px;
    color: #d4af37;
    display: block;
    margin: 10px 0;
    font-style: italic;
  }

  .date {
    font-size: 14px;
    letter-spacing: 4px;
    color: #d4af37;
    margin-top: 30px;
    padding: 14px 30px;
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 40px;
    display: inline-block;
  }

  .quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: rgba(245,245,245,0.85);
    margin-top: 40px;
    line-height: 1.9;
    max-width: 440px;
  }

  .btn {
    display: inline-block;
    margin-top: 40px;
    padding: 16px 44px;
    background: transparent;
    color: #d4af37;
    border: 1.5px solid #d4af37;
    text-decoration: none;
    border-radius: 40px;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: #d4af37;
    transition: left 0.4s ease;
    z-index: -1;
  }

  .btn:hover {
    color: #1a1a2e;
  }

  .btn:hover::before {
    left: 0;
  }
</style>
</head>
<body>

  <!-- PARTIKEL -->
  <div id="particles-js"></div>

  <div class="container">
    <div class="ornamen">✨</div>

    <p class="subtitle">The Wedding Of</p>

    <h1 class="names">
      Sarah
      <span class="amp">&</span>
      Dimas
    </h1>

    <div class="date">20 · 06 · 2026</div>

    <p class="quote">
      "Two souls, one heart, one beautiful journey begins."
    </p>

    <a href="#acara" class="btn">Open Invitation</a>
  </div>

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: {
          value: 60,
          density: { enable: true, value_area: 800 }
        },
        color: { value: ["#d4af37", "#ffffff", "#f5e6a8"] },
        shape: { type: "circle" },
        opacity: {
          value: 0.6,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.1 }
        },
        size: {
          value: 3,
          random: true,
          anim: { enable: true, speed: 2, size_min: 0.5 }
        },
        line_linked: { enable: false },
        move: {
          enable: true,
          speed: 1.2,
          direction: "none",
          random: true,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" }
        },
        modes: {
          grab: { distance: 140, line_linked: { opacity: 0.5 } },
          push: { particles_nb: 3 }
        }
      },
      retina_detect: true
    });
  </script>

</body>
</html>
